services:
  craft-web-server:
    image: ghcr.io/OWNER/craft-web-server:latest   # or: build: .
    restart: unless-stopped
    ports:
      - "8080:8080"   # the apps
      - "8081:8081"   # the dashboard (keep it on your internal network)
    volumes:
      - craftweb-data:/data
    environment:
      # Used once, only if no password exists yet. Prefer: docker compose exec craft-web-server python -m craftweb passwd
      # CRAFTWEB_ADMIN_PASSWORD: "change-me-please"
      GITHUB_TOKEN: ""   # optional: private repositories / higher API limits

volumes:
  craftweb-data:
