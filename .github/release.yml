# Categories for the auto-generated "What's changed" section of each release.
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot, github-actions]
  categories:
    - title: "🚀 Features"
      labels: [enhancement, feature]
    - title: "🐛 Fixes"
      labels: [bug, fix]
    - title: "🔒 Security"
      labels: [security]
    - title: "📦 Dependencies"
      labels: [dependencies]
    - title: "Other changes"
      labels: ["*"]
